
name: Android ARM32 Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-arm32:
    name: Android ARM32 (NDK + CMake)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-24 ndk;27.2.12479018'

      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$ANDROID_NDK/build/cmake/android.toolchain.cmake"

          if [ ! -f "$TOOLCHAIN" ]; then
            echo "::error::Android NDK toolchain not found: $TOOLCHAIN"
            exit 1
          fi

          rm -rf out/build

          cmake -S . -B out/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_ANDROID_ARCH_ABI=armeabi-v7a \
            -DCMAKE_ANDROID_NDK="$ANDROID_NDK" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_TESTING=OFF \
            -DBUILD_TESTS=OFF

      - name: Build
        shell: bash
        run: |
          set -euo pipefail

          cmake --build out/build \
            --config Release \
            --parallel 2

      - name: Collect all build files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          DIRECTORIES=(
            "out/build/ps2xAnalyzer"
            "out/build/ps2xRuntime"
            "out/build/ps2xIOP"
            "out/build/ps2xRecomp"
          )

          for DIR in "${DIRECTORIES[@]}"; do
            if [ ! -d "$DIR" ]; then
              echo "::error::Directory not found: $DIR"
              exit 1
            fi

            DEST="artifacts/$DIR"

            mkdir -p "$DEST"
            cp -a "$DIR/." "$DEST/"

            echo "Collected: $DIR"
          done

          echo ""
          echo "Collected files:"
          find artifacts -type f -print

          echo ""
          echo "Total artifact size:"
          du -sh artifacts

      - name: Upload all build files
        uses: actions/upload-artifact@v4
        with:
          name: PS2Recomp-Android-ARM32-All-Files
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
