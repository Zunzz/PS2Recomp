name: Android ARM32 Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-arm32:
    name: Android ARM32 (NDK + CMake)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-24 ndk;27.2.12479018'

      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$ANDROID_NDK/build/cmake/android.toolchain.cmake"

          if [ ! -f "$TOOLCHAIN" ]; then
            echo "::error::Android NDK toolchain not found: $TOOLCHAIN"
            exit 1
          fi

          rm -rf out/build

          cmake -S . -B out/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_ANDROID_ARCH_ABI=armeabi-v7a \
            -DCMAKE_ANDROID_NDK="$ANDROID_NDK" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_TESTING=OFF \
            -DBUILD_TESTS=OFF

      - name: Build
        shell: bash
        run: |
          set -euo pipefail

          cmake --build out/build \
            --config Release \
            --parallel 2

      - name: Verify build outputs
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f out/build/build.ninja ]; then
            echo "::error::Ninja build files were not generated."
            exit 1
          fi

          echo "Generated files:"
          find out/build -maxdepth 3 -type f \
            \( -name 'ps2_recomp' \
               -o -name 'ps2xRecomp' \
               -o -name 'ps2xAnalyzer' \
               -o -name '*.a' \
               -o -name '*.so' \) \
            -print

      - name: Upload complete Android ARM32 build
        uses: actions/upload-artifact@v4
        with:
          name: PS2Recomp-Android-ARM32
          path: out/build/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
