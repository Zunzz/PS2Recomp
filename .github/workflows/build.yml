
name: Android ARM32 Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-arm32:
    name: Android ARM32 (NDK + CMake)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-24 ndk;27.2.12479018'

      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$ANDROID_NDK/build/cmake/android.toolchain.cmake"

          if [ ! -f "$TOOLCHAIN" ]; then
            echo "::error::Android NDK toolchain not found: $TOOLCHAIN"
            exit 1
          fi

          rm -rf out/build

          cmake -S . -B out/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_ANDROID_ARCH_ABI=armeabi-v7a \
            -DCMAKE_ANDROID_NDK="$ANDROID_NDK" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_TESTING=OFF \
            -DBUILD_TESTS=OFF

      - name: Build
        shell: bash
        run: |
          set -euo pipefail

          cmake --build out/build \
            --config Release \
            --parallel 2

      - name: Collect executables
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          COUNT=0

          while IFS= read -r -d '' BIN; do
            DEST="artifacts/${BIN#out/build/}"

            mkdir -p "$(dirname "$DEST")"
            cp "$BIN" "$DEST"
            chmod +x "$DEST"

            echo "Collected: $BIN -> $DEST"
            COUNT=$((COUNT + 1))
          done < <(
            find out/build \
              -type f \
              -name 'ps2_recomp' \
              ! -path '*/CMakeFiles/*' \
              -print0
          )

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No ps2_recomp executables found in out/build"
            exit 1
          fi

          echo "Total executables collected: $COUNT"
          echo "Collected files:"
          find artifacts -type f -print

          echo "Total artifact size:"
          du -sh artifacts

      - name: Upload Android executables
        uses: actions/upload-artifact@v4
        with:
          name: PS2Recomp-Android-ARM32
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
